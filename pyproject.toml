[project]
name = "supply-risk"
version = "0.1.0"
description = "Autonomous supply chain risk analysis agent (LangChain deepagents + open models on Nebius Token Factory)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.18",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.4",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
    "yfinance>=1.7.0",
]

[project.scripts]
supply-risk = "supply_risk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_risk"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
